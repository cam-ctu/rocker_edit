name: Report on edited files

on:
  push:
    branches:
      - "master"
    paths:
      - "build/*"
      - "scripts/*"
      - ".github/workflows_original/*"
  pull_request:
    branches:
      - "master"
    paths:
      - "build/*"
      - "scripts/*"
      - ".github/workflows_original/*"
  workflow_run:
    workflows:
      - "Update Repo from Rocker_Versions2"
    branches:
      - "master"
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_reports:
    if: always()
    runs-on: ubuntu-latest
    container:
      image: rocker/tidyverse:latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
      - name: Set as safe for following git commands
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout wiki
        uses: actions/checkout@v7
        with:
          repository: "${{ github.repository }}.wiki"
          path: reports
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: tmp
          pattern: tmp-*
          merge-multiple: true
      - name: Generate Edits wiki page
        run: |
          make --always-make edits-page
      - name: Upload artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports
      - name: Update wiki
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Automated update
          repository: reports
